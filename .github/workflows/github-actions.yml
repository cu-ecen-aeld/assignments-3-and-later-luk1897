name: assignment-test
on:
    push:
        tags-ignore:
            - '*'
        branches:
            - '*'
jobs:
    unit-test:
        container: cuaesd/aesd-autotest:24-unit-test
        runs-on: self-hosted
        steps:
          - uses: actions/checkout@v2
          - name: Checkout submodules
            run : git submodule update --init --recursive
          - name: Run unit test
            run: ./unit-test.sh
                  echo "Utente effettivo: $(whoami)"
                  echo "HOME: $HOME"
                  echo "Contenuto di /home/luk/Desktop:"
                  ls -la /home/luk/Desktop || echo "NO ACCESS"
                  echo "Contenuto di /opt/toolchain:"
                  ls -la /opt/toolchain || echo "NO ACCESS"
    full-test:
        container: cuaesd/aesd-autotest:24-assignment3
        runs-on: self-hosted
        steps:
          - uses: actions/checkout@v2
          - name: Checkout submodules
            run : git submodule update --init --recursive
          - name: Run full test
            run: echo "Utente effettivo: $(whoami)"
                  echo "HOME: $HOME"
                  echo "Contenuto di /home/luk/Desktop:"
                  ls -la /home/luk/Desktop || echo "NO ACCESS"
                  echo "Contenuto di /opt/toolchain:"
                  ls -la /opt/toolchain || echo "NO ACCESS"
                  ./full-test.sh
